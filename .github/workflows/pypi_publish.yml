name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-flight:
    name: Pre-flight checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --all-extras

      - name: Audit production dependencies
        run: |
          uv export --no-dev --no-emit-workspace --no-hashes -o "${{ runner.temp }}/requirements-audit.txt"
          uv run pip-audit -r "${{ runner.temp }}/requirements-audit.txt"

      - name: Run full quality gate
        run: make all

      - name: Verify checkout unchanged
        run: make verify-clean

  build:
    name: Build immutable release bundle
    needs: pre-flight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --all-extras

      - name: Verify tag, source, runtime, and release notes
        run: |
          uv run python scripts/check_release_contract.py \
            --tag "${GITHUB_REF_NAME}" \
            --notes-out release-bundle/RELEASE_NOTES.md

      - name: Build wheel and source distribution once
        run: uv build --out-dir release-bundle/dist

      - name: Generate locked CycloneDX and dependency-license evidence
        run: |
          uv export --preview-features sbom-export --format cyclonedx1.5 \
            --no-dev --locked \
            --output-file "${{ runner.temp }}/runtime.cdx.json"
          uv export --preview-features sbom-export --format cyclonedx1.5 \
            --all-extras --no-dev --locked \
            --output-file release-bundle/SBOM.cdx.json
          uv export --preview-features sbom-export --format cyclonedx1.5 \
            --all-extras --all-groups --locked \
            --output-file "${{ runner.temp }}/development.cdx.json"
          uv run python scripts/generate_supply_chain_evidence.py \
            --runtime-sbom "${{ runner.temp }}/runtime.cdx.json" \
            --production-sbom release-bundle/SBOM.cdx.json \
            --development-sbom "${{ runner.temp }}/development.cdx.json" \
            --inventory-out release-bundle/DEPENDENCY_LICENSES.json \
            --project-root .

      - name: Verify wheel and package metadata
        run: |
          wheel_count=0
          for wheel in release-bundle/dist/*.whl; do
            uv run python scripts/check_wheel_contract.py "$wheel"
            wheel_count=$((wheel_count + 1))
          done
          test "$wheel_count" -eq 1
          uvx --from twine==6.2.0 twine check release-bundle/dist/*

      - name: Record and verify distribution digests
        working-directory: release-bundle
        run: |
          sha256sum dist/* SBOM.cdx.json DEPENDENCY_LICENSES.json \
            | sed 's#  dist/#  #' > SHA256SUMS
          sed -E 's#  ([^/]+(\.whl|\.tar\.gz))$#  dist/\1#' SHA256SUMS \
            | sha256sum --check -

      - name: Attest release artifact provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release-bundle/dist/*
            release-bundle/SBOM.cdx.json
            release-bundle/DEPENDENCY_LICENSES.json
            release-bundle/SHA256SUMS

      - name: Bind the production SBOM to the distributions
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-bundle/dist/*
          sbom-path: release-bundle/SBOM.cdx.json

      - name: Verify GitHub attestations before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in \
            release-bundle/dist/* \
            release-bundle/SBOM.cdx.json \
            release-bundle/DEPENDENCY_LICENSES.json \
            release-bundle/SHA256SUMS
          do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish exact distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/logseq-matryca-parser
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: release-bundle

      - name: Verify distribution digests
        working-directory: release-bundle
        run: |
          sed -E 's#  ([^/]+(\.whl|\.tar\.gz))$#  dist/\1#' SHA256SUMS \
            | sha256sum --check -

      - name: Publish package distributions with OIDC attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-bundle/dist/

  github-release:
    name: Publish GitHub Release from exact distributions
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: release-bundle

      - name: Verify distribution digests
        working-directory: release-bundle
        run: |
          sed -E 's#  ([^/]+(\.whl|\.tar\.gz))$#  dist/\1#' SHA256SUMS \
            | sha256sum --check -

      - name: Create GitHub Release with verified artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-bundle/RELEASE_NOTES.md
          files: |
            release-bundle/dist/*
            release-bundle/SBOM.cdx.json
            release-bundle/DEPENDENCY_LICENSES.json
            release-bundle/SHA256SUMS
          generate_release_notes: false
          make_latest: true
