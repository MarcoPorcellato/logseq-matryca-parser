name: Daily Metrics Saver

on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 03:00 UTC.
  workflow_dispatch: # Allows one-click manual runs.

concurrency:
  group: daily-metrics-${{ github.repository }}-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Force the Node.js 24 runtime to prevent the June 2026 deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  save-metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted default branch
        # zizmor: ignore[artipacked] -- this trusted main-only job must push metrics.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify and fast-forward trusted branch
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git pull --ff-only origin main

      - name: Fetch and Archive Quarterly Metrics
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: python scripts/archive_repository_metrics.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add metrics/
          if git diff --quiet && git diff --staged --quiet; then
            echo "No metric changes to commit."
            exit 0
          fi
          git commit -m "chore(analytics): archive quarterly repository metrics [skip ci]"
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed metrics archive (attempt ${attempt})."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}/${max_attempts}), retrying after backoff..."
            sleep $((attempt * 3))
          done
          echo "Failed to push metrics after ${max_attempts} attempts."
          exit 1
